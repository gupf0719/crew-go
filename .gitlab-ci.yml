# crew-go GitLab CI (OKR 9.4)
#
# build / test / race / vet 覆盖根模块和三个子模块。test 阶段也跑真实 SQL 后端。
# 覆盖率门禁: 核心包 >= 75% (scripts/check-coverage.sh); MR / 徽章看核心包合并 total。

stages:
  - build
  - test
  - lint
  - coverage

# go.mod toolchain go1.26.4 —— 用精确 image 免运行时下载 toolchain。
default:
  image: golang:1.26.4
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .gocache/
  before_script:
    - export GOPATH="$CI_PROJECT_DIR/.gocache/gopath"
    - export GOCACHE="$CI_PROJECT_DIR/.gocache/build"
    - export PATH="$GOPATH/bin:$PATH"

# ---------- build ----------
# 主 module + 3 个独立 go module (redis / sql / a2a/zk, 各自 go.mod + replace 主 module)。
build:
  stage: build
  script:
    - go build ./...
    - (cd redis && go build ./...)
    - (cd sql && go build ./...)
    - (cd a2a/zk && go build ./...)

# ---------- test (主 module + 3 个子模块单测, 不连外网) ----------
# go.work 下根目录 `go test ./...` **不含** redis / sql / a2a/zk 三个子模块的包, 要各自进目录跑。
# 默认测试用 miniredis 和 SQLite。依赖真实服务的用例使用 integration 标签。
test:
  stage: test
  script:
    - go test ./...
    - (cd redis && go test ./...)
    - (cd sql && go test ./...)
    - (cd a2a/zk && go test ./...)

# ---------- PostgreSQL / MySQL 集成测试 ----------
test-postgres:
  stage: test
  services:
    - postgres:16.9
  variables:
    POSTGRES_DB: crew_test
    POSTGRES_USER: crew_test
    POSTGRES_PASSWORD: crew_test
    CREW_SQL_POSTGRES_DSN: "host=postgres port=5432 user=crew_test password=crew_test dbname=crew_test sslmode=disable"
  script:
    - test -n "$CREW_SQL_POSTGRES_DSN"
    - go -C sql test -race -tags=integration -count=1 -timeout=5m -run '^TestPostgresIntegration$' .

test-mysql:
  stage: test
  services:
    - mysql:8.0.35
  variables:
    MYSQL_DATABASE: crew_test
    MYSQL_USER: crew_test
    MYSQL_PASSWORD: crew_test
    MYSQL_ROOT_PASSWORD: crew_root_test
    CREW_SQL_MYSQL_DSN: "crew_test:crew_test@tcp(mysql:3306)/crew_test?parseTime=true"
  script:
    - test -n "$CREW_SQL_MYSQL_DSN"
    - go -C sql test -race -tags=integration -count=1 -timeout=5m -run '^TestMySQLIntegration$' .

# ---------- race (主 module + 子模块竞态检测) ----------
race:
  stage: test
  script:
    - go test -race ./...
    - (cd redis && go test -race ./...)
    - (cd sql && go test -race ./...)
    - (cd a2a/zk && go test -race ./...)

# ---------- vet ----------
vet:
  stage: test
  script:
    - go vet ./...
    - (cd redis && go vet ./...)
    - (cd sql && go vet ./...)
    - (cd a2a/zk && go vet ./...)

# ---------- lint (golangci-lint, 规则见 .golangci.yml) ----------
lint:
  stage: lint
  script:
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
    - golangci-lint run

# ---------- coverage (核心包 >= 75% 门禁 + 徽章) ----------
# GitLab 经 coverage 正则抓核心包合并 total, 显示在 MR 概览 / pipeline 徽章。
coverage:
  stage: coverage
  script:
    - bash scripts/check-coverage.sh
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  # 覆盖率快照 (ISSUE-52 #4): 每条 pipeline 留 30 天 profile, 本地
  # `go tool cover -html=coverage.out` 看行级; 历次涨落在 pipeline 列表按 job 对比.
  artifacts:
    paths:
      - coverage.out
    expire_in: 30 days
